name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      publish_release:
        description: 'Publish as GitHub Release for direct public download'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Configure Keystore from CI Secrets (if available)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "RELEASE_KEYSTORE_CONFIGURED=true" >> $GITHUB_ENV
          else
            echo "RELEASE_KEYSTORE_CONFIGURED=false" >> $GITHUB_ENV
          fi

      - name: Ensure Android Project & Make Gradlew Executable
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder missing, adding Capacitor Android..."
            npx cap add android
          fi
          npx cap sync android
          if [ ! -f "android/gradlew" ]; then
            echo "Gradle wrapper script missing, generating..."
            cd android
            gradle wrapper || gradle wrapper --gradle-version 8.14.3 || true
            cd ..
          fi
          chmod +x android/gradlew || true

      - name: Build Android APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          REQUESTED_BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          cd android
          if [ "$REQUESTED_BUILD_TYPE" = "release" ] && [ "$RELEASE_KEYSTORE_CONFIGURED" = "true" ]; then
            echo "Building Signed Release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          elif [ "$REQUESTED_BUILD_TYPE" = "release" ]; then
            echo "Building Unsigned Release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK Output & Checksums
        run: |
          mkdir -p dist-apk
          # Find and copy all built APKs
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/ \;
          
          # Rename to easy-to-recognize names if present
          if [ -f "dist-apk/app-debug.apk" ]; then
            cp "dist-apk/app-debug.apk" "dist-apk/masrofy-app-debug.apk"
          fi
          if [ -f "dist-apk/app-release.apk" ]; then
            cp "dist-apk/app-release.apk" "dist-apk/masrofy-app-release.apk"
          fi
          if [ -f "dist-apk/app-release-unsigned.apk" ]; then
            cp "dist-apk/app-release-unsigned.apk" "dist-apk/masrofy-app-release-unsigned.apk"
          fi

          # Compute SHA256 checksums
          cd dist-apk
          sha256sum *.apk > SHA256SUMS.txt
          cd ..
          ls -la dist-apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masrofy-Android-APK
          path: dist-apk/*
          retention-days: 60

      - name: Determine Release Metadata
        id: release_meta
        run: |
          RUN_NUM="${{ github.run_number }}"
          REF_NAME="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${REF_NAME}" >> $GITHUB_OUTPUT
            echo "title=Release ${REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=apk-build-${RUN_NUM}" >> $GITHUB_OUTPUT
            echo "title=Android APK Build #${RUN_NUM}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release (if requested or tagged)
        if: ${{ (github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apk/*.apk
            dist-apk/SHA256SUMS.txt
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body: |
            Masrofy Android APK (مصروفي)
            
            Download the attached APK below to install on your Android device.
            
            Installation Instructions:
            1. Download masrofy-app-debug.apk directly to your phone.
            2. Open the downloaded file to install.
            3. If prompted by Android or Google Play Protect, choose More details -> Install anyway.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Summary
        run: |
          echo "### Android APK Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The APK package has been built and saved to Artifacts." >> $GITHUB_STEP_SUMMARY
          echo "- Artifact Name: Masrofy-Android-APK" >> $GITHUB_STEP_SUMMARY
          echo "- Files:" >> $GITHUB_STEP_SUMMARY
          ls -la dist-apk/*.apk | awk '{print "  - " $9 " (" $5 " bytes)"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To download, go to the top of this GitHub Actions run and download the Masrofy-Android-APK archive." >> $GITHUB_STEP_SUMMARY
